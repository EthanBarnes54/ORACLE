# ORACLE's suite on both systems it runs on: the rack's Windows PC and a Mac.
# The bench fixtures are in tests/data; the parity tests against the original
# programs skip here, since ORIGINAL_DAQ_STUFF is not part of the repository.
name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Python and dependencies, as install.bat and install.sh make them
        run: uv sync --managed-python
      - name: Tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: uv run --no-sync python -m pytest -q -p no:cacheprovider
